name: drift-check

on:
  schedule:
    - cron: "17 13 * * *" # daily 13:17 UTC (6:17 PDT / 5:17 PST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # keepalive step re-enables this workflow so the schedule never lapses

concurrency:
  group: drift-check
  cancel-in-progress: false

env:
  TF_DIRS: infra bootstrap # stacks planned for drift, space-separated
  TF_IN_AUTOMATION: "true"

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: drift
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false # wrapper swallows -detailed-exitcode

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: creds
        with:
          aws-access-key-id: ${{ secrets.DRIFT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DRIFT_AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.DRIFT_ROLE_ARN }}
          role-session-name: drift-check
          role-duration-seconds: 900
          role-skip-session-tagging: true # trust policy doesn't grant sts:TagSession
          aws-region: us-east-2

      - name: Mask account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          for d in $TF_DIRS; do
            terraform -chdir="$d" init -input=false -no-color \
              -backend-config="bucket=$TF_STATE_BUCKET" > /dev/null
          done

      - name: Plan
        id: plan
        run: |
          # Overall code: 1 if any stack errored, else 2 if any drifted, else 0
          set +e
          code=0
          for d in $TF_DIRS; do
            terraform -chdir="$d" plan -detailed-exitcode -lock=false -input=false \
              -no-color -out=tfplan > "plan-$d.log" 2>&1
            c=$?
            echo "$d plan exit code: $c (0 = clean, 2 = drift)"
            if [ "$c" -eq 1 ]; then
              echo "::error::terraform plan errored in $d"
              grep -E '^(Error|│)' "plan-$d.log" | head -n 40 # errors only, never the full plan
              code=1
            elif [ "$c" -eq 2 ] && [ "$code" -eq 0 ]; then
              code=2
            fi
          done
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]

      - name: Summarize drift
        if: steps.plan.outputs.code == '2'
        run: |
          for d in $TF_DIRS; do
            terraform -chdir="$d" show -json tfplan \
              | jq -r --arg d "$d" '.resource_changes[]? | select(.change.actions != ["no-op"])
                       | "- `\($d)/\(.address)`: \(.change.actions | join("/"))"'
          done > summary.md
          [ -s summary.md ] || echo "- No resource changes; only output values differ" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update drift issue
        if: steps.plan.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'Drift detected: %s\n\n%s\n\nReproduce locally: `./drift-check.sh`' "$run_url" "$(cat summary.md)")
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Infrastructure drift detected" --label drift --body "$body"
          fi
          exit 1 # red run = visible alert

      - name: Close drift issue if clean
        if: steps.plan.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Clean plan in run $GITHUB_RUN_ID"
          fi

      - name: Validate IAM policies (Access Analyzer)
        if: always() && (steps.plan.outputs.code == '0' || steps.plan.outputs.code == '2')
        run: |
          set +e
          PLAN_FILE=tfplan ./policy-check.sh $TF_DIRS | tee policy.log
          code=${PIPESTATUS[0]}
          {
            echo "### IAM policy validation"
            echo '```'
            grep -E '^  (OK|SKIP|FAIL|NOTE) |^Checked ' policy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Check access key age
        if: always() && steps.creds.outcome == 'success'
        env:
          KEY_ID: ${{ secrets.DRIFT_AWS_ACCESS_KEY_ID }}
        run: |
          created=$(aws iam list-access-keys --user-name drift-check-ci \
            --query "AccessKeyMetadata[?AccessKeyId=='${KEY_ID}'].CreateDate" --output text)
          if [ -z "$created" ] || [ "$created" = "None" ]; then
            echo "::error::in-use access key not found on drift-check-ci"
            exit 1
          fi
          created_s=$(date -u -d "$created" +%s)
          age=$(( ( $(date -u +%s) - created_s ) / 86400 ))
          due=$(date -u -d "@$(( created_s + 90 * 86400 ))" +%F)
          {
            echo "### Access key age"
            echo "Key age: ${age} days · rotation due: ${due}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$age" -ge 90 ]; then
            echo "::error::drift-check-ci key is ${age} days old (due ${due}); rotate per EXCEPTIONS.md#drift-ci"
            exit 1
          elif [ "$age" -ge 75 ]; then
            echo "::warning::drift-check-ci key is ${age} days old; rotation due ${due}"
          fi
          echo "key age ${age} days, rotation due ${due}"

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repository activity. Re-enabling this workflow through the API on every
      # scheduled run keeps the schedule alive without dummy commits. Best-effort:
      # it never fails the run.
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/drift-check.yml/enable" \
            || echo "::warning::could not re-enable drift-check schedule"
